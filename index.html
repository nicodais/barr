<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#e8b98a" />

    <title>Shamal — dune driving in the Emirati desert</title>
    <meta name="description" content="A calm open-world drive through the dunes of Liwa and Fossil Rock. No timers, no damage, no way to lose — just sand, golden light, and Ahmed on the radio." />

    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="canonical" href="https://barr-six.vercel.app/" />

    <!--
      Open Graph and Twitter cards.

      Not optional for something whose whole pitch is "look at this". Without
      them a pasted link renders as a bare grey rectangle in X, Discord, Slack,
      WhatsApp and iMessage — which is where every share of a browser game
      actually happens. og:image must be an absolute URL; relative paths are
      silently dropped by most crawlers.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shamal" />
    <meta property="og:title" content="Shamal — dune driving in the Emirati desert" />
    <meta property="og:description" content="A calm open-world drive through the dunes of Liwa and Fossil Rock. No timers, no damage, no way to lose — just sand, golden light, and Ahmed on the radio." />
    <meta property="og:url" content="https://barr-six.vercel.app/" />
    <meta property="og:image" content="https://barr-six.vercel.app/share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A low-poly 4x4 on a red dune crest at golden hour, with the great dune of Liwa behind it." />
    <meta property="og:locale" content="en_GB" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shamal — dune driving in the Emirati desert" />
    <meta name="twitter:description" content="A calm open-world drive through the dunes of Liwa and Fossil Rock. No timers, no damage, no way to lose." />
    <meta name="twitter:image" content="https://barr-six.vercel.app/share.png" />
  </head>
  <body>
    <canvas
      id="viewport"
      role="img"
      aria-label="The desert, seen from behind your vehicle"
    ></canvas>
    <div id="ui"></div>
    <div id="loader">Warming the sand…</div>
    <div id="help">
      <b>WASD</b> drive · <b>Space</b> handbrake · <b>[ ]</b> tyres · <b>Q/E</b> look · <b>R</b> reset · <b>P</b> photo · <b>G</b> garage
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
