<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#e8b98a" />
    <title>Going Barr</title>
    <!-- Reem Kufi: geometric Kufi calligraphy with Latin support — the title
         face. Everything else stays on the system stack. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <div id="ui"></div>
    <div id="loader">Warming the sand…</div>
    <div id="help">
      <b>WASD</b> drive · <b>Space</b> handbrake · <b>Q/E</b> look · <b>R</b> reset · <b>P</b> photo · <b>T</b> options
    </div>
    <!-- Title splash: static markup so it paints before any JS runs. -->
    <div id="splash">
      <div class="splash-content">
        <span class="splash-ar" lang="ar" aria-hidden="true">بَرّ</span>
        <h1>Going Barr</h1>
        <p>A tribute to the UAE</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
