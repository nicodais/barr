name: CI

# The correctness gate the pipeline was missing. Vercel already builds a
# preview per branch, so this job deliberately does not build — it type-checks
# and runs the suites, which is the part nothing else was doing.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
